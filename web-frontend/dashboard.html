<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pengaturan Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #eef6f1; --bg2: #f7fbf6; --card: #ffffffee; --text: #182623; --muted: #5b6b66;
    --accent: #1fbf6e; --accent-dark: #139a58; --border: #d9e8e1; --danger: #ef4444;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #0c1512; --bg2: #0a100e; --card: #121c19ee; --text: #eaf5ef; --muted: #96a6a0;
      --accent: #27d87e; --accent-dark: #1fae67; --border: #203029; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg2), var(--bg1));
    min-height: 100%;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; position: sticky; top: 0; z-index: 10;
    background: var(--bg1); border-bottom: 1px solid var(--border);
  }
  .iconbtn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; text-decoration: none; color: var(--text);
  }
  .topbar h2 { font-family: "Poppins", sans-serif; font-size: 1rem; margin: 0; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 16px; }

  .card { background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 14px; box-shadow: 0 8px 28px rgba(0,0,0,0.06); }
  .card h3 { font-family: "Poppins", sans-serif; font-size: 0.95rem; margin: 0 0 4px; }
  .card p.desc { color: var(--muted); font-size: 0.82rem; margin: 0 0 14px; }

  .switch-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 48px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--border); border-radius: 28px; cursor: pointer; transition: background .2s; }
  .slider::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(20px); }

  .option { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 8px; cursor: pointer; background: var(--bg1); }
  .option.active { border-color: var(--accent); background: rgba(31,191,110,0.08); }
  .option input { accent-color: var(--accent); width: 18px; height: 18px; }
  .option .label { font-weight: 600; font-size: 0.88rem; }
  .option .label small { display: block; font-weight: 400; color: var(--muted); font-size: 0.76rem; }

  .savebar { position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg1); border-top: 1px solid var(--border); }
  button.action { width: 100%; padding: 13px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button.action:disabled { opacity: 0.5; }
  .toast { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="iconbtn" href="index.html" aria-label="Kembali">←</a>
    <h2>⚙️ Pengaturan Bot</h2>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="switch-row">
        <div>
          <h3>Status Bot</h3>
          <p class="desc" style="margin-bottom:0">Matikan sementara tanpa hapus sesi login</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleEnabled" checked />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h3>Bot Boleh Jalan Di Mana?</h3>
      <p class="desc">Batasi bot supaya cuma merespon di tempat tertentu</p>

      <label class="option" data-value="both">
        <input type="radio" name="runMode" value="both" />
        <span class="label">Keduanya<small>Grup & Chat Pribadi</small></span>
      </label>
      <label class="option" data-value="group">
        <input type="radio" name="runMode" value="group" />
        <span class="label">Grup Saja<small>Bot diamkan chat pribadi</small></span>
      </label>
      <label class="option" data-value="dm">
        <input type="radio" name="runMode" value="dm" />
        <span class="label">Chat Pribadi Saja<small>Bot diamkan semua grup</small></span>
      </label>
    </div>
  </div>

  <div class="savebar">
    <button class="action" id="btnSave">💾 Simpan Pengaturan</button>
    <div class="toast" id="toast"></div>
  </div>

<script>
  const BACKEND_URL = "https://wabot-project-production.up.railway.app";
  const toggleEnabled = document.getElementById("toggleEnabled");
  const toast = document.getElementById("toast");

  function markActiveOption(value) {
    document.querySelectorAll(".option").forEach((el) => {
      el.classList.toggle("active", el.dataset.value === value);
      const input = el.querySelector("input");
      if (input.value === value) input.checked = true;
    });
  }

  document.querySelectorAll(".option").forEach((el) => {
    el.addEventListener("click", () => markActiveOption(el.dataset.value));
  });

  async function loadSettings() {
    try {
      const res = await fetch(BACKEND_URL + "/api/settings");
      const s = await res.json();
      toggleEnabled.checked = s.enabled;
      markActiveOption(s.runMode || "both");
    } catch (e) {
      toast.textContent = "Gagal memuat pengaturan dari server.";
    }
  }

  document.getElementById("btnSave").onclick = async () => {
    const runMode = document.querySelector('input[name="runMode"]:checked')?.value || "both";
    toast.textContent = "Menyimpan...";
    try {
      const res = await fetch(BACKEND_URL + "/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: toggleEnabled.checked, runMode }),
      });
      if (!res.ok) throw new Error("Gagal simpan");
      toast.textContent = "✅ Tersimpan!";
      setTimeout(() => (toast.textContent = ""), 2000);
    } catch (e) {
      toast.textContent = "❌ Gagal menyimpan pengaturan.";
    }
  };

  loadSettings();
</script>
</body>
  </html>
